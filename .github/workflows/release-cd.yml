name: Release Linux Binaries

# Builds a tagged CoCalc release (e.g. v0.11.4-cocalc.1, see COCALC.md) for
# x86_64 and arm64, natively, with a sha256 file per archive.  The archive
# names match what CoCalc's install.ts downloads:
#   rustic-<tag>-linux-{x86_64,arm64}.tar.gz
# A tag is only built if it points at a commit on the `cocalc/main` branch on which
# "CoCalc CI" succeeded.  The GitHub release is created as a draft; it is
# published by hand after checking the assets.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to build and publish, e.g. v0.11.4-cocalc.1
        required: true
  push:
    tags:
      - "v*.*.*-cocalc.*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  BINARY_NAME: rustic

jobs:
  verify:
    name: Verify the tagged commit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        run: echo "tag=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ steps.tag.outputs.tag }}
      - name: The tag is a CoCalc release of a commit on cocalc that passed CoCalc CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-cocalc\.[0-9]+$ ]] || { echo "not a CoCalc release tag: $TAG" >&2; exit 1; }
          sha="$(git rev-parse "refs/tags/$TAG^{commit}")"
          git fetch -q origin cocalc/main
          git merge-base --is-ancestor "$sha" origin/cocalc/main || { echo "$sha is not on the cocalc/main branch" >&2; exit 1; }
          ok="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/cocalc-ci.yml/runs?head_sha=$sha&status=success" --jq '.total_count')"
          [ "$ok" -gt 0 ] || { echo "CoCalc CI has not succeeded on $sha" >&2; exit 1; }

  build:
    name: Build ${{ matrix.asset_name }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            asset_name: linux-x86_64
          - runner: ubuntu-24.04-arm
            asset_name: linux-arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: refs/tags/${{ needs.verify.outputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # v1
        with:
          toolchain: 1.94.0

      - name: Build release binary
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          # `rustic --version` then prints e.g. "rustic 0.11.4-cocalc.1",
          # the version install.ts compares with.
          PROJECT_VERSION="${TAG#v}" cargo build --locked --release
          test "$(target/release/rustic --version)" = "rustic ${TAG#v}"

      - name: Package release artifact
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          staging="$(mktemp -d)"
          cp "target/release/${BINARY_NAME}" "${staging}/${BINARY_NAME}"
          chmod 755 "${staging}/${BINARY_NAME}"
          archive="${BINARY_NAME}-${TAG}-${{ matrix.asset_name }}.tar.gz"
          tar -C "${staging}" -czf "${archive}" "${BINARY_NAME}"
          sha256sum "${archive}" > "${archive}.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            rustic-*.tar.gz
            rustic-*.tar.gz.sha256

  release:
    name: Publish GitHub release (draft)
    needs: [verify, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all workflow artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2
        with:
          draft: true
          fail_on_unmatched_files: true
          tag_name: ${{ needs.verify.outputs.tag }}
          files: |
            */rustic-*.tar.gz
            */rustic-*.tar.gz.sha256
