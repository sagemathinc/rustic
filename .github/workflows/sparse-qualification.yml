name: Sparse Recovery Qualification

on:
  pull_request:
  push:
    branches: ["cocalc/sparse-backups"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # v1
        with:
          toolchain: 1.94.0
      - uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2
      - run: cargo test --locked --tests --jobs 4
      - run: python3 tests/qualification_bundle_test.py
      - run: cargo build --locked --release --jobs 4
      - name: Qualify read-only Btrfs snapshots and enforced quota
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y btrfs-progs
          disk="$(mktemp /tmp/sparse-qualification.XXXXXX.img)"
          mount="$(mktemp -d /tmp/sparse-qualification.XXXXXX)"
          trap 'sudo umount "$mount" || true; sudo rm -f "$disk"; rmdir "$mount" || true' EXIT
          truncate -s 8G "$disk"
          sudo mkfs.btrfs -q "$disk"
          sudo mount -o loop "$disk" "$mount"
          sudo touch "$mount/.cocalc-disposable-sparse-qualification"
          sudo python3 tests/sparse_btrfs.py "$PWD/target/release/rustic" "$mount" "$PWD/qualification.json"
      - name: Package tested candidate and recovery evidence
        run: python3 tests/qualification_bundle.py target/release/rustic qualification.json candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sparse-candidate-${{ matrix.runner }}
          path: candidate/*
          if-no-files-found: error
          retention-days: 90

  attest:
    # Only this small, source-free job gets signing permissions. Untrusted PRs
    # may build/test candidates but cannot acquire our provenance identity.
    if: github.repository == 'sagemathinc/rustic' && github.ref == 'refs/heads/cocalc/sparse-backups' && github.event_name != 'pull_request'
    needs: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: sparse-candidate-*
          path: candidates
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        id: provenance
        with:
          subject-path: candidates/**/*.tar.xz
      - name: Verify each candidate against this exact source and workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          candidates=(candidates/sparse-candidate-*/*.tar.xz)
          test "${#candidates[@]}" -eq 2
          mkdir verified
          for candidate in "${candidates[@]}"; do
            gh attestation verify "$candidate" \
              --bundle "$ATTESTATION_BUNDLE" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/sparse-qualification.yml" \
              --source-digest "$GITHUB_SHA" \
              --source-ref refs/heads/cocalc/sparse-backups \
              --deny-self-hosted-runners --format json \
              > "verified/$(basename "$candidate").json"
            if gh attestation verify "$candidate" --bundle "$ATTESTATION_BUNDLE" \
                --repo "$GITHUB_REPOSITORY" \
                --source-digest 0000000000000000000000000000000000000000; then
              echo "verification incorrectly accepted an unrelated source commit" >&2
              exit 1
            fi
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sparse-candidate-verification
          path: verified/*
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sparse-candidate-provenance
          path: ${{ steps.provenance.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 90
